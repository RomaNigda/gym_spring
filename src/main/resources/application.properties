spring.application.name=gym_spring

db.url=${DB_URL:jdbc:postgresql://localhost:5433/gym_crm}
db.username=${DB_USERNAME:gym}
db.password=${DB_PASSWORD:gym}
db.pool.max-size=10

hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.hbm2ddl.auto=update
hibernate.show_sql=true
hibernate.format_sql=true
