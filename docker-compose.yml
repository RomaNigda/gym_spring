services:
  postgres:
    image: postgres:15-alpine
    container_name: gym_crm_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-gym_crm}
      POSTGRES_USER: ${DB_USERNAME:-gym}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gym}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - gym_crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gym} -d ${DB_NAME:-gym_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: gym_crm_app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-gym_crm}
      DB_USERNAME: ${DB_USERNAME:-gym}
      DB_PASSWORD: ${DB_PASSWORD:-gym}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gym_crm_data:
